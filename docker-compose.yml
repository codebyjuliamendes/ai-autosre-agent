services:
  agent:
    build: .
    image: ai-autosre-agent:local
    ports:
      - '${HOST_PORT:-4002}:4002'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '4002'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
