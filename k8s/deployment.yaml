apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-autosre-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-autosre-agent
  template:
    metadata:
      labels:
        app: ai-autosre-agent
    spec:
      containers:
      - name: app
        image: ai-autosre-agent:latest
        ports:
        - containerPort: 4002
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/state
            port: 4002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/state
            port: 4002
          initialDelaySeconds: 15
          periodSeconds: 20
