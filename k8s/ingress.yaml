apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-autosre-agent-ingress
  annotations:
    # Server-Sent Events: do not buffer and allow long-lived connections.
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-autosre-agent-service
                port:
                  name: http
