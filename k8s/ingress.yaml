apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-autosre-agent-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-autosre-agent-service
            port:
              number: 4002
